<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>ApexOps AI - Test</h1>
    <p>Estado: <span id="estado">Iniciando...</span></p>
    <div id="resultado"></div>

    <script>
        const SUPABASE_URL = 'https://kwuzffxcahzqpzfohlup.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3dXpmZnhjYWh6cXB6Zm9obHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MDIzNzMsImV4cCI6MjA4OTk3ODM3M30.6FVlmfIvqjsLt-i3SAvbcZUEIXkb2fcoyYngzwDgnc4';

        console.log('Iniciando...');
        console.log('URL:', SUPABASE_URL);

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        async function test() {
            try {
                document.getElementById('estado').textContent = 'Conectando a Supabase...';
                console.log('Conectando...');

                const { data, error } = await supabase
                    .from('pos_locales')
                    .select('*');

                console.log('Respuesta:', { data, error });

                if (error) {
                    document.getElementById('estado').textContent = 'ERROR: ' + error.message;
                    document.getElementById('resultado').innerHTML = '<pre style="color: red;">' + JSON.stringify(error, null, 2) + '</pre>';
                    return;
                }

                document.getElementById('estado').textContent = 'ÉXITO - Datos cargados';
                document.getElementById('resultado').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';

            } catch (e) {
                console.error('Excepción:', e);
                document.getElementById('estado').textContent = 'EXCEPCIÓN: ' + e.message;
                document.getElementById('resultado').innerHTML = '<pre style="color: red;">' + e.message + '</pre>';
            }
        }

        test();
    </script>
</body>
</html>
