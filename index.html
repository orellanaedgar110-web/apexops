<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexOps AI - ERP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        
        .login-page {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-box {
            background: white; padding: 50px; border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 450px;
        }
        
        .login-box h1 { text-align: center; color: #667eea; margin-bottom: 40px; font-size: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 15px;
        }
        
        .btn-login {
            width: 100%; padding: 12px; background: #667eea; color: white;
            border: none; border-radius: 5px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 20px;
        }
        
        .btn-login:hover { background: #5568d3; }
        
        .error-msg {
            background: #f8d7da; color: #721c24; padding: 12px;
            border-radius: 5px; margin-bottom: 20px; display: none;
        }
        
        .app-page { display: none; }
        .app-page.active { display: block; }
        
        .matriz-container { display: flex; height: 100vh; background: white; }
        
        .matriz-sidebar {
            width: 250px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 20px; overflow-y: auto;
        }
        
        .matriz-sidebar h2 { margin-bottom: 30px; font-size: 20px; }
        
        .matriz-menu-item {
            padding: 12px 15px; margin-bottom: 10px;
            background: rgba(255,255,255,0.1); border-left: 3px solid transparent;
            cursor: pointer; border-radius: 4px; transition: all 0.3s;
        }
        
        .matriz-menu-item:hover { background: rgba(255,255,255,0.2); border-left-color: white; }
        .matriz-menu-item.active { background: rgba(255,255,255,0.3); border-left-color: #51cf66; }
        
        .matriz-content { flex: 1; padding: 20px; overflow-y: auto; background: #f5f5f5; }
        
        .matriz-header {
            background: white; padding: 15px 20px; display: flex;
            justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .btn-logout { background: #ff6b6b; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        
        .card {
            background: white; padding: 20px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 5px solid #667eea;
        }
        
        .card h3 { color: #667eea; font-size: 14px; margin-bottom: 10px; }
        .card .big-number { font-size: 32px; font-weight: bold; color: #333; }
        
        .sucursales-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px; margin-top: 20px;
        }
        
        .sucursal-btn {
            padding: 20px; background: white; border: 2px solid #ddd;
            border-radius: 8px; cursor: pointer; text-align: center;
            transition: all 0.3s; font-weight: 500;
        }
        
        .sucursal-btn:hover { border-color: #667eea; background: #f0f4ff; }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: white; padding: 30px; border-radius: 10px;
            width: 90%; max-width: 900px; max-height: 90vh; overflow-y: auto;
        }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { color: #333; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        
        .categorias-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .categoria-box {
            background: white; padding: 15px; border-radius: 8px;
            border: 2px solid #667eea;
        }
        
        .categoria-box h4 { color: #667eea; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #667eea; }
        
        .producto-row {
            display: flex; gap: 8px; margin-bottom: 10px; align-items: center;
        }
        
        .producto-row label { flex: 1; font-size: 13px; }
        .producto-row input { width: 70px; padding: 5px; border: 1px solid #ddd; border-radius: 4px; text-align: center; font-weight: bold; }
        .producto-row button { padding: 5px 8px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .producto-row button:first-of-type { background: #ff9800; }
        
        .btn-success { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; }
        .btn-success:hover { background: #218838; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        table th { background: #f8f9fa; font-weight: bold; }
        
        h2 { margin-bottom: 20px; color: #333; }
        h3 { margin-bottom: 15px; color: #555; }
    </style>
</head>
<body>

<div id="loginPage" class="login-page">
    <div class="login-box">
        <h1>🚀 ApexOps AI</h1>
        <div id="errorMsg" class="error-msg"></div>
        <div class="form-group">
            <label>Local:</label>
            <select id="selectLocal"><option value="">Cargando...</option></select>
        </div>
        <div class="form-group">
            <label>Usuario:</label>
            <input type="text" id="inputUser" placeholder="usuario1">
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="inputPass" placeholder="1234">
        </div>
        <button class="btn-login" id="btnLogin" onclick="doLogin()">Ingresar</button>
    </div>
</div>

<div id="matrizPage" class="app-page">
    <div class="matriz-container">
        <div class="matriz-sidebar">
            <h2>📊 MATRIZ</h2>
            <div class="matriz-menu-item active" onclick="showSection('inicio')">🏠 Inicio</div>
            <div class="matriz-menu-item" onclick="showSection('enviar')">📤 Enviar Productos</div>
            <div class="matriz-menu-item" onclick="showSection('reportes')">📊 Reportes</div>
            <hr style="margin: 20px 0; opacity: 0.3;">
            <button class="btn-logout" onclick="doLogout()" style="width: 100%;">Cerrar</button>
        </div>
        
        <div class="matriz-content">
            <div class="matriz-header">
                <div><h2 id="headerMatriz">MATRIZ</h2></div>
            </div>
            
            <div id="inicioSection" class="section" style="display: block;">
                <h2>Dashboard</h2>
                <div class="dashboard-grid">
                    <div class="card"><h3>Ventas Hoy</h3><div class="big-number">$<span id="ventasHoy">0</span></div></div>
                    <div class="card"><h3>Total Mes</h3><div class="big-number">$<span id="ventasMes">0</span></div></div>
                    <div class="card"><h3>Locales</h3><div class="big-number"><span id="totalLocales">5</span></div></div>
                </div>
            </div>
            
            <div id="enviarSection" class="section" style="display: none;">
                <h2>Enviar Productos</h2>
                <h3>Selecciona Sucursal</h3>
                <div class="sucursales-grid" id="sucursalesGrid"></div>
            </div>
            
            <div id="reportesSection" class="section" style="display: none;">
                <h2>Reportes</h2>
                <table>
                    <thead><tr><th>Fecha</th><th>Sucursal</th><th>Productos</th></tr></thead>
                    <tbody id="reportesBody"><tr><td colspan="3">Sin guías</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="modalEnviar" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitulo">Enviar a Sucursal</h2>
            <button class="modal-close" onclick="cerrarModal()">×</button>
        </div>
        
        <h3>Selecciona Productos</h3>
        <div id="categoriasContainer" class="categorias-container"></div>
        
        <h3>Resumen</h3>
        <table>
            <thead><tr><th>Producto</th><th>Cantidad</th></tr></thead>
            <tbody id="resumenTable"><tr><td colspan="2">Sin productos</td></tr></tbody>
        </table>
        
        <button class="btn-success" onclick="generarGuia()">Generar Guía</button>
    </div>
</div>

<script>
const API_URL = 'https://kwuzffxcahzqpzfohlup.supabase.co/rest/v1';
const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3dXpmZnhjYWh6cXB6Zm9obHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MDIzNzMsImV4cCI6MjA4OTk3ODM3M30.6FVlmfIvqjsLt-i3SAvbcZUEIXkb2fcoyYngzwDgnc4';

let user = null, local = null, locales = [], productos = [], selectedSucursal = null;
let envio = {};

async function apiCall(table) {
    const headers = { 'apikey': API_KEY, 'Authorization': 'Bearer ' + API_KEY };
    const response = await fetch(API_URL + '/' + table, { method: 'GET', headers });
    if (!response.ok) throw new Error(await response.text());
    return await response.json();
}

window.addEventListener('DOMContentLoaded', async () => {
    locales = await apiCall('pos_locales');
    productos = await apiCall('pos_productos_fiore');
    
    const select = document.getElementById('selectLocal');
    select.innerHTML = '<option value="">Selecciona</option>';
    locales.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id;
        opt.textContent = l.nombre;
        select.appendChild(opt);
    });
});

async function doLogin() {
    const localId = document.getElementById('selectLocal').value;
    const usuario = document.getElementById('inputUser').value.trim();
    const pass = document.getElementById('inputPass').value.trim();
    
    if (!localId || !usuario || !pass) return alert('Completa los campos');
    
    try {
        const users = await apiCall('pos_usuarios');
        const u = users.find(x => x.local_id == localId && x.usuario === usuario && x.contraseña === pass);
        if (!u) return alert('Credenciales incorrectas');
        
        user = u;
        local = locales.find(l => l.id == localId);
        
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('matrizPage').classList.add('active');
        document.getElementById('headerMatriz').textContent = local.nombre;
        
        loadDashboard();
        loadSucursales();
    } catch (e) {
        alert('Error: ' + e.message);
    }
}

function loadDashboard() {
    document.getElementById('totalLocales').textContent = locales.length;
}

function loadSucursales() {
    const html = locales.filter(l => !l.es_matriz).map(l => 
        `<button class="sucursal-btn" onclick="abrirModal(${l.id}, '${l.nombre}')">🏪<br>${l.nombre}<br><small>${l.ciudad}</small></button>`
    ).join('');
    document.getElementById('sucursalesGrid').innerHTML = html;
}

function abrirModal(localId, localNombre) {
    selectedSucursal = { id: localId, nombre: localNombre };
    document.getElementById('modalTitulo').textContent = `Enviar a ${localNombre}`;
    envio = {};
    
    const categorias = {};
    productos.forEach(p => {
        if (!categorias[p.categoria]) categorias[p.categoria] = [];
        categorias[p.categoria].push(p);
    });
    
    let html = '';
    Object.entries(categorias).forEach(([cat, prods]) => {
        html += `<div class="categoria-box"><h4>${cat}</h4>`;
        prods.forEach(p => {
            html += `<div class="producto-row">
                <label>${p.codigo}</label>
                <input type="number" id="p${p.id}" min="0" value="0" onchange="actualizarResumen()">
                <button onclick="dec(${p.id})">−</button>
                <button onclick="inc(${p.id})">+</button>
            </div>`;
        });
        html += `</div>`;
    });
    
    document.getElementById('categoriasContainer').innerHTML = html;
    document.getElementById('modalEnviar').classList.add('active');
}

function inc(id) { const el = document.getElementById(`p${id}`); el.value = parseInt(el.value) + 1; actualizarResumen(); }
function dec(id) { const el = document.getElementById(`p${id}`); el.value = Math.max(0, parseInt(el.value) - 1); actualizarResumen(); }

function actualizarResumen() {
    let html = '';
    productos.forEach(p => {
        const input = document.getElementById(`p${p.id}`);
        const cant = input ? parseInt(input.value) : 0;
        if (cant > 0) {
            html += `<tr><td>${p.codigo}</td><td>${cant}</td></tr>`;
            envio[p.id] = cant;
        }
    });
    document.getElementById('resumenTable').innerHTML = html || '<tr><td colspan="2">Sin productos</td></tr>';
}

async function generarGuia() {
    if (Object.keys(envio).length === 0) return alert('Agrega productos');
    
    const numeroGuia = 'GU-' + Date.now();
    alert(`✓ Guía #${numeroGuia} generada para ${selectedSucursal.nombre}`);
    cerrarModal();
}

function cerrarModal() {
    document.getElementById('modalEnviar').classList.remove('active');
}

function showSection(section) {
    document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
    document.getElementById(section + 'Section').style.display = 'block';
    
    document.querySelectorAll('.matriz-menu-item').forEach(m => m.classList.remove('active'));
    event.target.classList.add('active');
}

function doLogout() {
    if (confirm('¿Cerrar sesión?')) location.reload();
}

function showError(msg) {
    const div = document.getElementById('errorMsg');
    div.textContent = msg;
    div.style.display = 'block';
    setTimeout(() => div.style.display = 'none', 5000);
}
</script>

</body>
</html>
