<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexOps AI - POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; background: white; min-height: 100vh; }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .login-box h2 { text-align: center; margin-bottom: 30px; color: #667eea; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        .btn:hover { background: #5568d3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            border-left: 4px solid;
            display: none;
        }
        
        .alert-error {
            background: #f8d7da;
            border-color: #ff6b6b;
            color: #721c24;
        }
        
        .alert.show { display: block; }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 { font-size: 24px; font-weight: bold; }
        .header-info { display: flex; gap: 20px; align-items: center; }
        .header-info span { font-size: 14px; opacity: 0.9; }
        
        .btn-logout {
            background: #ff6b6b;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .btn-logout:hover { background: #ff5252; }
        
        .nav-main {
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 0;
        }
        
        .nav-btn {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .nav-btn:hover { background: #eee; }
        .nav-btn.active { color: #667eea; border-bottom-color: #667eea; background: #f0f4ff; }
        
        .content { padding: 20px; }
        .page { display: none; }
        .page.show { display: block; }
        
        .loading { text-align: center; padding: 20px; color: #999; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .producto-btn {
            padding: 15px 10px;
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 12px;
        }
        
        .producto-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .producto-nombre { font-weight: 500; margin-bottom: 5px; }
        .producto-precio { color: #51cf66; font-weight: bold; font-size: 14px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        table thead { background: #f8f9fa; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        table th { font-weight: 600; }
        
        .carrito-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }
        
        .carrito-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        
        .resumen {
            background: white;
            padding: 15px;
            border: 2px solid #667eea;
            border-radius: 4px;
            margin-top: 20px;
        }
        
        .resumen-linea {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .resumen-linea.total {
            border-bottom: none;
            font-weight: bold;
            font-size: 16px;
            color: #51cf66;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #eee;
        }
    </style>
</head>
<body>
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <h2>🛒 ApexOps AI - POS</h2>
            <div id="loginError" class="alert alert-error"></div>
            
            <div class="form-group">
                <label>Seleccionar Local</label>
                <select id="selectLocal">
                    <option value="">-- Cargando locales --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="usuario" placeholder="Tu usuario">
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="Tu contraseña">
            </div>

            <button class="btn" id="btnLogin" onclick="login()">Ingresar</button>
        </div>
    </div>

    <div id="mainApp" style="display:none;">
        <div class="header">
            <h1>🛒 ApexOps AI - POS</h1>
            <div class="header-info">
                <span id="headerLocal">-</span>
                <span id="headerUsuario">-</span>
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>

        <div class="nav-main">
            <button class="nav-btn active" onclick="irPos()">📦 POS</button>
            <button class="nav-btn" onclick="irReportes()">📊 Reportes</button>
            <button class="nav-btn" onclick="irProductos()">🏷️ Productos</button>
        </div>

        <div class="content">
            <div id="posPage" class="page show">
                <h2>📦 Sistema de Venta</h2>
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px;">
                    <div>
                        <h3>Productos Disponibles</h3>
                        <div id="productosGrid" class="productos-grid">
                            <div class="loading"><div class="spinner"></div> Cargando...</div>
                        </div>
                    </div>

                    <div>
                        <h3>Carrito</h3>
                        <div id="carritoContainer" class="carrito-section">
                            <div id="carritoItems"></div>
                        </div>

                        <div class="resumen">
                            <div class="resumen-linea">
                                <span>Total:</span>
                                <span id="totalSpan">$0.00</span>
                            </div>
                        </div>

                        <button class="btn" onclick="generarVenta()" style="background: #51cf66;">✓ Generar Venta</button>
                        <button class="btn" onclick="limpiarCarrito()" style="background: #999;">Limpiar</button>
                    </div>
                </div>
            </div>

            <div id="reportesPage" class="page">
                <h2>📊 Reportes</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Factura #</th>
                            <th>Cliente</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="reportesTableBody">
                        <tr><td colspan="4" style="text-align: center;">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="productosPage" class="page">
                <h2>🏷️ Gestión de Productos (Solo Matriz)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                        </tr>
                    </thead>
                    <tbody id="productosTableBody">
                        <tr><td colspan="4" style="text-align: center;">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kwuzffxcahzqpzfohlup.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3dXpmZnhjYWh6cXB6Zm9obHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MDIzNzMsImV4cCI6MjA4OTk3ODM3M30.6FVlmfIvqjsLt-i3SAvbcZUEIXkb2fcoyYngzwDgnc4';

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioActual = null;
        let localActual = null;
        let carrito = [];
        let productos = [];

        // INICIALIZAR
        document.addEventListener('DOMContentLoaded', () => {
            cargarLocales();
        });

        async function cargarLocales() {
            try {
                console.log('Cargando locales...');
                const { data, error } = await supabase
                    .from('pos_locales')
                    .select('id, nombre, es_matriz')
                    .eq('activo', true)
                    .order('es_matriz', { ascending: false });

                if (error) {
                    console.error('Error:', error);
                    mostrarError('Error cargando locales: ' + error.message);
                    return;
                }

                console.log('Locales cargados:', data);
                const select = document.getElementById('selectLocal');
                select.innerHTML = '<option value="">-- Selecciona tu local --</option>';
                
                data.forEach(local => {
                    const option = document.createElement('option');
                    option.value = local.id;
                    option.textContent = local.nombre + (local.es_matriz ? ' (MATRIZ)' : '');
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error: ' + error.message);
            }
        }

        async function login() {
            const localId = parseInt(document.getElementById('selectLocal').value);
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!localId || !usuario || !password) {
                mostrarError('Por favor completa todos los campos');
                return;
            }

            document.getElementById('btnLogin').disabled = true;

            try {
                console.log('Intentando login...');
                const { data, error } = await supabase
                    .from('pos_usuarios')
                    .select('*')
                    .eq('local_id', localId)
                    .eq('usuario', usuario)
                    .eq('activo', true)
                    .single();

                if (error || !data) {
                    mostrarError('Usuario o contraseña incorrectos');
                    document.getElementById('btnLogin').disabled = false;
                    return;
                }

                if (data.contraseña !== password) {
                    mostrarError('Usuario o contraseña incorrectos');
                    document.getElementById('btnLogin').disabled = false;
                    return;
                }

                usuarioActual = data;
                const { data: local } = await supabase
                    .from('pos_locales')
                    .select('*')
                    .eq('id', localId)
                    .single();

                localActual = local;

                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('headerLocal').textContent = `Local: ${local.nombre}`;
                document.getElementById('headerUsuario').textContent = `Usuario: ${usuarioActual.nombre}`;

                await cargarProductos();
                await cargarReportes();

            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error: ' + error.message);
                document.getElementById('btnLogin').disabled = false;
            }
        }

        async function cargarProductos() {
            try {
                const { data, error } = await supabase
                    .from('pos_productos')
                    .select('*')
                    .eq('activo', true)
                    .order('nombre');

                if (error) throw error;

                productos = data;
                const grid = document.getElementById('productosGrid');
                grid.innerHTML = '';

                data.forEach(prod => {
                    const btn = document.createElement('button');
                    btn.className = 'producto-btn';
                    btn.innerHTML = `
                        <div class="producto-nombre">${prod.codigo}</div>
                        <div>${prod.nombre}</div>
                        <div class="producto-precio">$${prod.precio_venta}</div>
                    `;
                    btn.onclick = () => agregarAlCarrito(prod);
                    grid.appendChild(btn);
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function agregarAlCarrito(producto) {
            const existente = carrito.find(item => item.id === producto.id);
            if (existente) {
                existente.cantidad += 1;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const container = document.getElementById('carritoItems');
            if (carrito.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">Carrito vacío</p>';
            } else {
                container.innerHTML = carrito.map((item, idx) => `
                    <div class="carrito-item">
                        <div style="flex: 1;">
                            <strong>${item.nombre}</strong><br>
                            <small>${item.codigo}</small>
                        </div>
                        <input type="number" value="${item.cantidad}" min="1" onchange="cambiarCantidad(${idx}, this.value)" style="width: 60px; padding: 5px;">
                        <div style="min-width: 80px; text-align: right;"><strong>$${(item.precio_venta * item.cantidad).toFixed(2)}</strong></div>
                        <button onclick="eliminarDelCarrito(${idx})" style="background: #ff6b6b; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">×</button>
                    </div>
                `).join('');
            }

            const total = carrito.reduce((sum, item) => sum + (item.precio_venta * item.cantidad), 0);
            document.getElementById('totalSpan').textContent = `$${total.toFixed(2)}`;
        }

        function cambiarCantidad(idx, cantidad) {
            carrito[idx].cantidad = Math.max(1, parseInt(cantidad) || 1);
            actualizarCarrito();
        }

        function eliminarDelCarrito(idx) {
            carrito.splice(idx, 1);
            actualizarCarrito();
        }

        async function generarVenta() {
            if (carrito.length === 0) {
                alert('El carrito está vacío');
                return;
            }

            try {
                const total = carrito.reduce((sum, item) => sum + (item.precio_venta * item.cantidad), 0);
                
                const { data: maxFactura } = await supabase
                    .from('pos_ventas')
                    .select('numero_factura')
                    .order('numero_factura', { ascending: false })
                    .limit(1);

                const numeroFactura = (maxFactura && maxFactura.length > 0 ? maxFactura[0].numero_factura + 1 : 1000);

                const { data: venta, error: errorVenta } = await supabase
                    .from('pos_ventas')
                    .insert({
                        numero_factura: numeroFactura,
                        local_id: localActual.id,
                        usuario_id: usuarioActual.id,
                        fecha_venta: new Date().toISOString().split('T')[0],
                        cliente_nombre: 'CONSUMIDOR FINAL',
                        subtotal: total,
                        total: total,
                        metodo_pago: 'Efectivo',
                        estado: 'activa'
                    })
                    .select()
                    .single();

                if (errorVenta) throw errorVenta;

                const detalles = carrito.map(item => ({
                    venta_id: venta.id,
                    producto_id: item.id,
                    cantidad: item.cantidad,
                    valor_unitario: item.precio_venta,
                    subtotal: item.precio_venta * item.cantidad
                }));

                const { error: errorDetalles } = await supabase
                    .from('pos_detalle_ventas')
                    .insert(detalles);

                if (errorDetalles) throw errorDetalles;

                alert(`✓ Venta #${numeroFactura} generada\nTotal: $${total.toFixed(2)}`);
                limpiarCarrito();
                await cargarReportes();

            } catch (error) {
                console.error('Error:', error);
                alert('Error: ' + error.message);
            }
        }

        function limpiarCarrito() {
            carrito = [];
            actualizarCarrito();
        }

        async function cargarReportes() {
            try {
                const { data, error } = await supabase
                    .from('pos_ventas')
                    .select('*')
                    .eq('local_id', localActual.id)
                    .order('fecha_venta', { ascending: false })
                    .limit(20);

                if (error) throw error;

                const tbody = document.getElementById('reportesTableBody');
                tbody.innerHTML = data.length > 0 ? data.map(venta => `
                    <tr>
                        <td>${venta.fecha_venta}</td>
                        <td>#${venta.numero_factura}</td>
                        <td>${venta.cliente_nombre}</td>
                        <td>$${venta.total.toFixed(2)}</td>
                    </tr>
                `).join('') : '<tr><td colspan="4" style="text-align: center;">Sin ventas</td></tr>';
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function irPos() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
            document.getElementById('posPage').classList.add('show');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function irReportes() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
            document.getElementById('reportesPage').classList.add('show');
            cargarReportes();
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function irProductos() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
            document.getElementById('productosPage').classList.add('show');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function logout() {
            if (confirm('¿Cerrar sesión?')) {
                usuarioActual = null;
                localActual = null;
                carrito = [];
                document.getElementById('loginPage').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('usuario').value = '';
                document.getElementById('password').value = '';
            }
        }

        function mostrarError(mensaje) {
            const div = document.getElementById('loginError');
            div.textContent = mensaje;
            div.classList.add('show');
            setTimeout(() => {
                div.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
